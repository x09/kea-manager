// Пример конфигурации kea-dhcp4 для проверки round-trip.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ]  # слушаем только eth0
    },
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    /* control-socket оставлен вручную — редактор не должен его потерять */
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases4.csv"
    },
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.0.2.0/24",
        "pools": [
          { "pool": "192.0.2.100 - 192.0.2.200" }
        ]
      }
    ]
  }
}
